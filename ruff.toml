# Ruff 配置：代码检查与格式化
# 文档：https://docs.astral.sh/ruff/configuration/

target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist", ".eggs"]

[lint]
# E  : pycodestyle 错误
# F  : pyflakes（未使用导入/变量等）
# I  : isort 导入排序
# UP : pyupgrade（向现代 Python 语法升级）
# B  : flake8-bugbear（常见陷阱）
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # 行长由 line-length 控制， formatter 自动处理
  "B008",  # FastAPI 中 File/Query 等作为默认值是惯用写法
]

[lint.per-file-ignores]
"tests/*" = ["B011"]  # 测试中允许 assert False 之类的写法
